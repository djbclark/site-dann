# The runtime-manifest skeleton for dann's sudo-secretspec vault.
#
# This is a DECLARATIONS template — names, descriptions and requirements only, never values. It
# is committed to a PUBLIC repo on purpose: it holds no secret. It is copied into the vault as
# `secretspec.toml` once (by systemd-tmpfiles `C`, which never overwrites), and the values are
# added at runtime through the broker (`sudo-secretspec source-add` / `source-set`), so no value
# ever enters this repo. `template-check` compares the runtime manifest against this tracked copy.
#
# The one vault secret, per ./sudo-secretspec.nix and the design note it links: the Gmail OAuth
# refresh token — the only credential the entity mutates at runtime. GITHUB_TOKEN and the OAuth
# client id/secret are static and stay in sops, NOT here. Extend this table only with secrets
# that no NixOS service consumes and that the entity itself mutates at runtime.

[project]
name = "dann"
revision = "1.0"

[profiles.default]
GMAIL_OAUTH_REFRESH_TOKEN = { description = "Gmail OAuth refresh token for technoeuphora@gmail.com (rotates at runtime; re-auth after a reinstall)", required = true }

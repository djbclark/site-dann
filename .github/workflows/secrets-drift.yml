name: secrets declared == secrets verified

# A static cross-check of three lists: the sops secrets the host DECLARES in Nix
# (`poolSecrets` in nixos/dann/hermes.nix, and the `sops.secrets = lib.genAttrs [ ... ]` list in
# nixos/dann/sudo-secretspec.nix) against the names `sops_report()` in nixos/dann/verify-pools.sh
# REPORTS on. It fails if the two sides differ as sets, or if either side names anything twice.
#
# WHY. `EXPECTED_BASE_CHECKS=18` in verify-pools.sh makes the COUNT of checks drift-proof, and only
# the count. It cannot see a swap: drop CLINE_API_KEY from `sops_report` and add a second
# GMAIL_OAUTH_CLIENT_ID and the count is still 18, still green. It cannot see the commoner slip
# either: add a secret to `sops.secrets`, forget `sops_report`, and the secret is declared,
# encrypted, deployed and never verified. That is the false-PASS class of #12 and #13, one level up.
# Today's tree agrees (4 + 3 declared, the same 7 reported), so this starts green: a tripwire for the
# next edit, not a cleanup.
#
# ZERO NAMES => FAIL, ON PURPOSE. If an extraction yields no names (a renamed variable, a reformatted
# list, a deleted file) the check refuses to pass vacuously: comparing 0 to 0 is a green that proves
# nothing. The fix is then to update the anchor in this workflow in the same commit as the rename.
# The three lists are each guarded, not just "either side", so the message names the broken source.
#
# FOUR TRAPS found while prototyping, each the reason for a choice in the awk below:
#   1. In `sops_report`, every name in the `for name in \` list ends with a ` \` continuation EXCEPT
#      the last. A `^NAME$` pattern silently matches only that last name (the prototype found 1 of
#      7). The list is therefore read as whitespace-separated fields, backslashes dropped, up to `do`.
#   2. sudo-secretspec.nix declares with `lib.genAttrs [ ... ] (_: {`: the closing bracket is
#      followed by `(`, not `;`, so a `];` anchor finds nothing. Any line holding `]` ends the list.
#   3. hermes.nix has OTHER `[ ... ]` lists above `poolSecrets` (the pool model names). Anchor on the
#      attribute name `poolSecrets = [`, never on "the first list in the file".
#   4. nixos/flake.nix also mentions `config.sops.secrets`, in a comment. Anchor on
#      `sops.secrets = lib.genAttrs [` at the start of a line (a `#` comment never matches), and
#      never read flake.nix.
#
# What it does not do: no Nix evaluation (that needs the build, ~12 min, on every PR), no decryption,
# no host, no comparison against /run/secrets. It proves the report covers every declaration;
# whether each file really decrypts stays with the host `pool-verify` run and secrets-encrypted.yml.
# Names are printed, values never exist here: these files hold none, and nothing else is read.
#
# Cheap on purpose: no Nix, no sops binary, no secrets in env. `shell: sh` is dash on
# ubuntu-latest and awk is mawk, so everything below is POSIX (no gawk extensions, no interval
# expressions, no `gensub`, no `\s`, no arrays in the shell).

"on":
  push:
    paths:
      - "nixos/dann/hermes.nix"
      - "nixos/dann/sudo-secretspec.nix"
      - "nixos/dann/verify-pools.sh"
      - ".github/workflows/secrets-drift.yml"
  pull_request:
    paths:
      - "nixos/dann/hermes.nix"
      - "nixos/dann/sudo-secretspec.nix"
      - "nixos/dann/verify-pools.sh"
      - ".github/workflows/secrets-drift.yml"

permissions: {}

jobs:
  drift:
    name: sops_report covers every declared secret
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Compare the declared secret names with the names sops_report checks
        shell: sh
        run: |
          set -eu
          HERMES=nixos/dann/hermes.nix
          SUDO=nixos/dann/sudo-secretspec.nix
          REPORT=nixos/dann/verify-pools.sh
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          fail=0

          # extract FILE KIND START OUT WHAT: write the names found in FILE to OUT, sorted, one per
          # line. START is a POSIX ERE with no backslashes (`[[]` for a literal bracket) because it
          # travels through awk -v, which processes escapes. A missing file or no match leaves OUT
          # empty; the caller's zero-name guard turns that into a failure.
          extract() {
            if [ ! -f "$1" ]; then
              : > "$4"
              return 0
            fi
            awk -v kind="$2" -v start="$3" '
              # Nix list: from the anchor line (text after its `[` counts) to the first line with
              # a `]`. Names are the double-quoted strings; `#` comments are dropped first.
              kind == "nix" {
                line = $0
                if (!inlist) {
                  if (line !~ start) next
                  inlist = 1
                  sub(start, "", line)
                }
                sub(/#.*/, "", line)
                closed = index(line, "]")
                if (closed) line = substr(line, 1, closed - 1)
                while (match(line, /"[^"]*"/)) {
                  print substr(line, RSTART + 1, RLENGTH - 2)
                  line = substr(line, RSTART + RLENGTH)
                }
                if (closed) exit
                next
              }
              # Shell list: the `for name in \` after the anchor (the sops_report function head),
              # as fields up to `do`. Reaching the closing `}` first means the list is gone.
              kind == "sh" {
                line = $0
                if (!insh) { if (line ~ start) insh = 1; next }
                if (line ~ /^}/) exit
                if (!inlist) {
                  if (line !~ /^[[:space:]]*for name in([[:space:]]|$)/) next
                  inlist = 1
                  sub(/^[[:space:]]*for name in/, "", line)
                }
                sub(/#.*/, "", line)
                gsub(/;/, " ", line)
                gsub(/\\/, " ", line)
                n = split(line, f, " ")
                for (i = 1; i <= n; i++) {
                  if (f[i] == "do") exit
                  print f[i]
                }
              }
            ' "$1" | LC_ALL=C sort > "$4"
          }

          extract "$HERMES" nix '^[[:space:]]*poolSecrets[[:space:]]*=[[:space:]]*[[]' "$tmp/hermes"
          extract "$SUDO" nix '^[[:space:]]*sops[.]secrets[[:space:]]*=[[:space:]]*lib[.]genAttrs[[:space:]]*[[]' "$tmp/sudo"
          extract "$REPORT" sh '^[[:space:]]*sops_report[(][)]' "$tmp/report"

          count() { awk 'END { print NR }' "$1"; }
          # names FILE ATTRIBUTION MESSAGE: one ::error per name in FILE; names only, never a value.
          names() {
            while IFS= read -r n; do
              echo "::error file=$2::$3: $n"
            done < "$1"
          }

          guard() {
            if [ "$(count "$2")" -eq 0 ]; then
              if [ -f "$1" ]; then why="no match for $3"; else why="the file is missing"; fi
              echo "::error file=$1::extracted no names from $1 ($why), refusing to pass vacuously; if it was renamed or reformatted, update the anchor in .github/workflows/secrets-drift.yml in the same commit"
              fail=1
            fi
          }
          guard "$HERMES" "$tmp/hermes" "poolSecrets = [ ... ]"
          guard "$SUDO" "$tmp/sudo" "sops.secrets = lib.genAttrs [ ... ]"
          guard "$REPORT" "$tmp/report" "the for name in list of sops_report()"
          if [ "$fail" -ne 0 ]; then
            echo "A zero-name extraction is a failure, not a pass: nothing was compared."
            exit 1
          fi

          # Multisets: equal as sets AND no duplicate on either side.
          LC_ALL=C sort "$tmp/hermes" "$tmp/sudo" > "$tmp/nix"
          for side in nix report; do
            uniq -d "$tmp/$side" > "$tmp/$side.dup"
            uniq "$tmp/$side" > "$tmp/$side.set"
          done
          if [ -s "$tmp/nix.dup" ]; then
            names "$tmp/nix.dup" "$HERMES" "declared more than once across hermes.nix poolSecrets and sudo-secretspec.nix"
            fail=1
          fi
          if [ -s "$tmp/report.dup" ]; then
            names "$tmp/report.dup" "$REPORT" "listed more than once in sops_report"
            fail=1
          fi
          comm -23 "$tmp/nix.set" "$tmp/report.set" > "$tmp/missing"
          comm -13 "$tmp/nix.set" "$tmp/report.set" > "$tmp/extra"
          if [ -s "$tmp/missing" ]; then
            names "$tmp/missing" "$REPORT" "declared in Nix but missing from sops_report (never verified)"
            fail=1
          fi
          if [ -s "$tmp/extra" ]; then
            names "$tmp/extra" "$REPORT" "in sops_report but declared in no Nix module (checks a file nothing deploys)"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "The declared secrets and sops_report disagree. Change nixos/dann/verify-pools.sh and the Nix"
            echo "declaration in the same commit, and keep EXPECTED_BASE_CHECKS in step."
            exit 1
          fi
          echo "$(count "$tmp/nix") declared secret names ($(count "$tmp/hermes") in hermes.nix poolSecrets, $(count "$tmp/sudo") in sudo-secretspec.nix) == $(count "$tmp/report") in sops_report, no duplicates."

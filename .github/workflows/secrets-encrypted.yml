name: secrets stay encrypted

# A shape check, not a decryptor: it fails if any file under nixos/dann/secrets/ stops looking
# like sops ciphertext — no top-level `sops:` block, no `mac: ENC[`, a plaintext `NAME=value`
# line in a .env, or a plaintext scalar before the `sops:` block. It cannot prove the ciphertext
# is good (only the host's key can decrypt); it proves nothing plaintext was committed by
# accident, which is what the review of 2026-10-28 found unguarded (F5).
#
# Cheap on purpose: no Nix, no sops binary, no secrets. Runs on a plain runner.

"on":
  push:
    paths:
      - "nixos/dann/secrets/**"
      - ".sops.yaml"
      - ".github/workflows/secrets-encrypted.yml"
  pull_request:
    paths:
      - "nixos/dann/secrets/**"
      - ".sops.yaml"

permissions: {}

jobs:
  encrypted:
    name: every committed secret is sops ciphertext
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the shape of every file under nixos/dann/secrets
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(nixos/dann/secrets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files under nixos/dann/secrets; nothing to check."
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::not a regular file"
              fail=1
              continue
            fi
            if ! grep -q '^sops:' "$f"; then
              echo "::error file=$f::no top-level 'sops:' block: plaintext, or not a sops file"
              fail=1
              continue
            fi
            if ! grep -q 'mac: ENC\[' "$f"; then
              echo "::error file=$f::no sops 'mac: ENC[' line"
              fail=1
            fi
            case "$f" in
              *.env)
                # A sops dotenv is KEY=ENC[AES256_GCM,...]; a bare KEY=value is plaintext. The
                # sops metadata block is appended at the end and is not a KEY=value line.
                while IFS= read -r line; do
                  case "$line" in
                    'sops:'*) break ;;
                    '' | '#'*) continue ;;
                  esac
                  case "$line" in
                    *=ENC\[*) ;;
                    *)
                      echo "::error file=$f::plaintext-looking line (no ENC[ after '='): ${line%%=*}=..."
                      fail=1
                      ;;
                  esac
                done <"$f"
                ;;
            esac
            # YAML/JSON: every scalar before the sops: block must itself be ENC[...].
            plain=$(awk '
              /^sops:/ { inSops = 1; next }
              inSops { next }
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*$/ { next }
              /:[[:space:]]*$/ { next }
              /^[[:space:]]*[^:]+:[[:space:]]+/ {
                key = $0
                sub(/:.*$/, "", key)
                value = $0
                sub(/^[[:space:]]*[^:]+:[[:space:]]+/, "", value)
                # Print the key only: a CI log in a public repo must not repeat the plaintext.
                if (value !~ /^ENC\[/) print "  line " FNR ": " key ": <plaintext>"
              }
            ' "$f")
            if [ -n "$plain" ]; then
              echo "::error file=$f::plaintext scalar before the sops: block"
              printf '%s\n' "$plain"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more secrets are not encrypted. Re-encrypt with:"
            echo "  sops --encrypt --in-place <file>   (or sops -e <plaintext> > <file>)"
            exit 1
          fi
          echo "all ${#files[@]} committed secret file(s) look like sops ciphertext."

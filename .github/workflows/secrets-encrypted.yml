name: secrets stay encrypted

# A shape check, not a decryptor: it fails if any file under nixos/dann/secrets/ (dotfiles
# included) stops looking like sops ciphertext for the host — no top-level `sops:` block (or
# `sops_mac=` in a .env), no `mac: ENC[`, the host's age key missing from the recipients, or any
# line outside the `sops:` block (including after it) that is not a key, a parent key, or a full
# `ENC[AES256_GCM,data:...,iv:...,tag:...,type:...]` value (data/iv/tag in the base64 alphabet).
#
# The `sops:` block itself is parsed against a strict allowlist, derived from what sops 3.13.3
# writes: blank lines; `version`, `lastmodified` (quoted timestamp), `mac` (a full ENC value),
# `unencrypted_suffix`/`encrypted_suffix`, the four `*_regex` keys, `mac_only_encrypted`,
# `shamir_threshold`; the container keys `age`, `pgp`, `kms`, `gcp_kms`, `azure_kv`, `hc_vault`,
# `key_groups` (empty, or `[]`) and the list-item keys under them (`recipient`, `fp`, `arn`, `role`,
# `created_at`, ...); and `enc: |` with a body of base64 lines between the armor BEGIN/END markers.
# The block ends at the next column-0 line that is not a comment; checking then resumes as normal.
#
# UNKNOWN KEY INSIDE `sops:` => FAIL, ON PURPOSE. This is a tripwire, not a bug: a sops release that
# adds metadata fails here until someone adds one entry to the L1/IT tables in the awk below (the
# error text says so). A failure never prints a value: file, line, key name (only if it is a short
# identifier), and `<plaintext>`.
#
# A `.env` has no `sops:` block; its `sops_*=` metadata lines get the same treatment: an exact key
# allowlist (`sops_age__list_N__map_enc` as literal-`\n` age armor, `..._map_recipient` as an age
# key, `sops_lastmodified` quoted or not, `sops_mac` as a full ENC value, `sops_version` as X.Y.Z,
# `sops_(un)encrypted_suffix` and `_regex`, `sops_mac_only_encrypted` as true/false), a value-shape
# test per key, and each key at most once. A metadata line is never skipped unread. Any other
# `sops_*` key (a kms/gcp_kms/azure_kv/hc_vault backend, say) is a HARD FAILURE, ON PURPOSE: the fix
# is to extend the allowlist in the awk of the `*.env` branch, in the same commit as the backend or
# flag that needs it. Messages carry file, line and key name, never the value.
#
# What it cannot see: a valid recipient with a broken or stale MAC, ciphertext sealed under a
# different key than the recipient line claims, or a pasted secret that happens to fit an
# allowlisted slot's alphabet (a base64-looking token inside an `enc: |` body between the markers,
# or in `version`, `*_suffix`, `*_regex`, `fp`, `arn` ... values, or in a `.env`'s `sops_*_suffix`,
# `sops_*_regex` values or a well-formed-looking `sops_age__list_N__map_enc` armor body). Only the
# host's private key can decrypt, so only the host (or the break-glass key) proves that. Plain
# `# comment` lines outside the `sops:` block are skipped, as sops itself leaves comments readable
# in some modes.
# The reviews of 2026-10-28 (F5) and 2026-11-01 (H2, M2) are what this guards.
#
# Cheap on purpose: no Nix, no sops binary, no secrets. Runs on a plain runner; the awk is POSIX
# (no interval expressions, no gawk extensions) so it runs under mawk and BSD awk alike.

"on":
  push:
    paths:
      - "nixos/dann/secrets/**"
      - ".sops.yaml"
      - ".github/workflows/secrets-encrypted.yml"
  pull_request:
    paths:
      - "nixos/dann/secrets/**"
      - ".sops.yaml"

permissions: {}

jobs:
  encrypted:
    name: every committed secret is sops ciphertext
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the shape and recipients of every file under nixos/dann/secrets
        env:
          # The host's age public key (dann.dclark.us), the same one as &dann in .sops.yaml. A secret
          # the host is not a recipient of builds green and then fails the unattended activation.
          HOST_AGE_KEY: age1kpu8804m763x7aet9pwhm92k4h44qmk34xmxg3yynhdsct5f4pfqrv548p
        run: |
          set -uo pipefail
          # dotglob: nixos/dann/secrets/.env is un-ignored in .gitignore, so it can be committed.
          shopt -s nullglob dotglob
          files=(nixos/dann/secrets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files under nixos/dann/secrets; nothing to check."
            exit 0
          fi
          fail=0
          if ! grep -q "&dann ${HOST_AGE_KEY}" .sops.yaml; then
            echo "::error file=.sops.yaml::&dann is not the host key this check requires; update HOST_AGE_KEY too"
            fail=1
          fi
          # A real ciphertext value: ENC[AES256_GCM,data:...,iv:...,tag:...,type:...]
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::not a regular file"
              fail=1
              continue
            fi
            case "$f" in
              *.env)
                # A sops dotenv is KEY=ENC[...] lines, then sops_* metadata lines (sops_mac=ENC[...],
                # sops_age__list_N__map_recipient=...); there is no `sops:` block.
                if ! grep -q '^sops_mac=ENC\[' "$f"; then
                  echo "::error file=$f::no 'sops_mac=ENC[' line: plaintext, or not a sops dotenv"
                  fail=1
                  continue
                fi
                if ! grep -Eq "^sops_age__list_[0-9]+__map_recipient=${HOST_AGE_KEY}$" "$f"; then
                  echo "::error file=$f::host age key is not a recipient"
                  fail=1
                fi
                # Print the key only: a CI log in a public repo must not repeat the plaintext.
                plain=$(awk '
                  BEGIN {
                    # Unquoted in a dotenv; the double-quoted form is what the YAML format writes.
                    TSRE = "^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z$"
                    TSQRE = "^\"[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z\"$"
                  }
                  # sops metadata lines: exact-key allowlist, one value shape per key, no repeats.
                  # Derived from what sops 3.13.3 writes for a dotenv with age recipients. An
                  # unknown sops_ key is a FAIL on purpose (the message says how to extend this).
                  # The `map_enc` value holds literal backslash-n sequences, hence `\\n` below.
                  /^sops_/ {
                    key = $0
                    if (key !~ /=/) { print "  line " FNR ": <sops_ line, no KEY=>"; next }
                    sub(/=.*$/, "", key)
                    val = substr($0, length(key) + 2)
                    shown = "<sops_ key, not an identifier>"
                    if (key ~ /^sops_[A-Za-z0-9_]+$/ && length(key) <= 64) shown = key
                    known = 1; ok = 0
                    if (key ~ /^sops_age__list_[0-9]+__map_enc$/)
                      ok = (val ~ /^-----BEGIN AGE ENCRYPTED FILE-----(\\n[A-Za-z0-9+\/=]+)+\\n-----END AGE ENCRYPTED FILE-----(\\n)?$/)
                    else if (key ~ /^sops_age__list_[0-9]+__map_recipient$/)
                      ok = (val ~ /^age1[023456789acdefghjklmnpqrstuvwxyz]+$/ && length(val) == 62)
                    else if (key == "sops_lastmodified")
                      ok = (val ~ TSRE || val ~ TSQRE)
                    else if (key == "sops_mac")
                      ok = (val ~ /^ENC\[AES256_GCM,data:[A-Za-z0-9+\/=]*,iv:[A-Za-z0-9+\/=]+,tag:[A-Za-z0-9+\/=]+,type:[a-z]+\]$/)
                    else if (key == "sops_version")
                      ok = (val ~ /^[0-9]+\.[0-9]+\.[0-9]+$/)
                    else if (key == "sops_unencrypted_suffix" || key == "sops_encrypted_suffix")
                      ok = (val ~ /^[A-Za-z0-9_-]+$/)
                    else if (key == "sops_unencrypted_regex" || key == "sops_encrypted_regex")
                      ok = (val ~ /^[][A-Za-z0-9_^$|.*+?(){}\\-]+$/)
                    else if (key == "sops_mac_only_encrypted")
                      ok = (val == "true" || val == "false")
                    else known = 0
                    if (!known) print "  line " FNR ": " shown ": unknown sops_ key; if sops now writes it, extend the dotenv metadata allowlist in .github/workflows/secrets-encrypted.yml in the same commit that adds the backend or flag"
                    else if (!ok) print "  line " FNR ": " shown ": value is not the shape sops writes for this key (value not printed)"
                    else if (key in seen) print "  line " FNR ": " shown ": repeated; sops writes each metadata key once"
                    seen[key] = 1
                    next
                  }
                  /^[[:space:]]*#/ { next }
                  /^[[:space:]]*$/ { next }
                  /^[A-Za-z_][A-Za-z0-9_]*=ENC\[AES256_GCM,data:[A-Za-z0-9+\/=]*,iv:[A-Za-z0-9+\/=]+,tag:[A-Za-z0-9+\/=]+,type:[a-z]+\][[:space:]]*$/ { next }
                  {
                    key = $0
                    if (key ~ /=/) { sub(/=.*$/, "", key); print "  line " FNR ": " key "=<plaintext>" }
                    else print "  line " FNR ": <plaintext line, no KEY=>"
                  }
                ' "$f")
                ;;
              *)
                if ! grep -q '^sops:[[:space:]]*$' "$f"; then
                  echo "::error file=$f::no top-level 'sops:' block: plaintext, or not a sops file"
                  fail=1
                  continue
                fi
                if ! grep -q 'mac: ENC\[' "$f"; then
                  echo "::error file=$f::no sops 'mac: ENC[' line"
                  fail=1
                fi
                if ! grep -Eq "recipient: ${HOST_AGE_KEY}\$" "$f"; then
                  echo "::error file=$f::host age key is not a recipient"
                  fail=1
                fi
                # Everything outside the sops: block must be a key, a parent key, or ciphertext.
                # The sops: block is parsed against the allowlist described in the header; it ends
                # at the next column-0 line that is not a comment, and that line (like any line
                # after it) is checked as normal, so plaintext appended after `sops:` is caught.
                plain=$(awk '
                  BEGIN {
                    ENCRE = "^ENC\\[AES256_GCM,data:[A-Za-z0-9+/=]*,iv:[A-Za-z0-9+/=]+,tag:[A-Za-z0-9+/=]+,type:[a-z]+\\][[:space:]]*$"
                    TSRE = "^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z$"
                    ARMOR = "^-----(BEGIN|END) (AGE ENCRYPTED FILE|PGP MESSAGE)-----$"
                    # The allowlist. Add a line here when a new sops release adds metadata.
                    # L1: keys directly under sops:   kind = scalar value shape, or "list"
                    L1["version"] = "ver"; L1["lastmodified"] = "ts"; L1["mac"] = "mac"
                    L1["unencrypted_suffix"] = "sfx"; L1["encrypted_suffix"] = "sfx"
                    L1["unencrypted_regex"] = "rx"; L1["encrypted_regex"] = "rx"
                    L1["unencrypted_comment_regex"] = "rx"; L1["encrypted_comment_regex"] = "rx"
                    L1["mac_only_encrypted"] = "bool"; L1["shamir_threshold"] = "num"
                    L1["age"] = "list"; L1["pgp"] = "list"; L1["kms"] = "list"; L1["gcp_kms"] = "list"
                    L1["azure_kv"] = "list"; L1["hc_vault"] = "list"; L1["key_groups"] = "list"
                    # IT: keys of a list item under a container
                    IT["enc"] = "enc"; IT["recipient"] = "rcpt"; IT["fp"] = "rcpt"; IT["created_at"] = "ts"
                    IT["arn"] = "id"; IT["role"] = "id"; IT["aws_profile"] = "id"; IT["resource_id"] = "id"
                    IT["vaultUrl"] = "id"; IT["name"] = "id"; IT["version"] = "id"; IT["vault_address"] = "id"
                    IT["engine_path"] = "id"; IT["key_name"] = "id"
                    # CONT: the containers that may appear inside a key_groups item
                    CONT["age"] = 1; CONT["pgp"] = 1; CONT["kms"] = 1; CONT["gcp_kms"] = 1
                    CONT["azure_kv"] = 1; CONT["hc_vault"] = 1
                  }
                  function bad(n, msg) { print "  line " n " (sops: block): " msg }
                  function unq(v,   n, c) {
                    n = length(v)
                    if (n >= 2) {
                      c = substr(v, 1, 1)
                      if ((c == "\047" || c == "\"") && substr(v, n, 1) == c) return substr(v, 2, n - 2)
                    }
                    return v
                  }
                  function okv(kind, v,   s) {
                    s = unq(v)
                    if (kind == "ver") return (s ~ /^[0-9][0-9.]*$/)
                    if (kind == "ts") return (s ~ TSRE)
                    if (kind == "mac") return (v ~ ENCRE)
                    if (kind == "sfx") return (s ~ /^[A-Za-z0-9_.-]+$/ && length(s) <= 64)
                    if (kind == "rx") return (s ~ /^[^[:space:]]+$/ && length(s) <= 200)
                    if (kind == "num") return (v ~ /^[0-9]+$/)
                    if (kind == "bool") return (v ~ /^(true|false)$/)
                    if (kind == "enc") return (s ~ "^[A-Za-z0-9+/=_:.-]+$")
                    if (kind == "rcpt") return ((s ~ /^age1[a-z0-9]+$/ && length(s) <= 200) || (s ~ /^[0-9A-Fa-f]+$/ && length(s) >= 16 && length(s) <= 64))
                    if (kind == "id") return (s ~ "^[A-Za-z0-9_.:/@+=-]*$" && length(s) <= 200)
                    return 0
                  }
                  function unknown(n, key) {
                    if (length(key) <= 32) bad(n, "unknown key " key " (not on the sops allowlist; if a new sops release added it, add it to L1/IT in this workflow)")
                    else bad(n, "unknown key (not on the sops allowlist)")
                  }
                  function endbody() {
                    inBody = 0
                    if (bState != 2) bad(encLine, "enc: | has no complete BEGIN..END armored body")
                  }
                  function sopsline(   line, rest, ind, dash, r, key, val, keycol, kind) {
                    line = $0
                    rest = line
                    sub(/^ +/, "", rest)
                    ind = length(line) - length(rest)
                    if (line ~ /\t/) { bad(FNR, "<plaintext> (tab)"); return }
                    if (inBody) {
                      if (rest == "") return
                      if (ind > bodyCol) {
                        if (bodyInd == 0) bodyInd = ind
                        if (ind != bodyInd) { bad(FNR, "<plaintext> (enc body indent)"); return }
                        if (bState == 0) {
                          if (rest ~ /^-----BEGIN /  && rest ~ ARMOR) bState = 1
                          else bad(FNR, "<plaintext> (enc body, no BEGIN marker)")
                          return
                        }
                        if (bState == 2) { bad(FNR, "<plaintext> (enc body, after END marker)"); return }
                        if (rest ~ ARMOR) { if (rest ~ /^-----END /) bState = 2; else bad(FNR, "<plaintext> (second BEGIN marker)"); return }
                        if (rest ~ "^[A-Za-z0-9+/=_-]+$" && length(rest) <= 64) return
                        bad(FNR, "<plaintext> (enc body is not base64)")
                        return
                      }
                      endbody()
                    }
                    if (rest == "") return
                    if (rest ~ /^#/) { bad(FNR, "<comment>"); return }
                    dash = 0
                    r = rest
                    if (r ~ /^- /) { dash = 1; sub(/^- /, "", r) }
                    if (r !~ /^[A-Za-z_][A-Za-z0-9_]*:( .*)?$/) { bad(FNR, "<plaintext line, no key>"); return }
                    key = r; sub(/:.*$/, "", key)
                    val = r; sub(/^[^:]*:/, "", val); sub(/^ +/, "", val); sub(/ +$/, "", val)
                    keycol = ind + (dash ? 2 : 0)
                    if (I1 == 0) I1 = ind
                    if (ind < I1) { bad(FNR, "<plaintext> (indent)"); return }
                    if (ind == I1) {
                      ctx1 = ""; ctx2 = ""
                      if (dash) { bad(FNR, "<plaintext line> (list item at the top of the block)"); return }
                      kind = L1[key]
                      if (kind == "") { unknown(FNR, key); return }
                      if (kind == "list") {
                        if (val != "" && val != "[]") bad(FNR, key ": <plaintext>")
                        ctx1 = key
                        return
                      }
                      if (!okv(kind, val)) bad(FNR, key ": <plaintext>")
                      return
                    }
                    if (ctx1 == "") { bad(FNR, "<plaintext line> (nested under a scalar)"); return }
                    if (ctx1 == "key_groups" && (key in CONT)) {
                      if (val != "" && val != "[]") bad(FNR, key ": <plaintext>")
                      ctx2 = key
                      return
                    }
                    kind = IT[key]
                    if (kind == "") { unknown(FNR, key); return }
                    if (ctx1 == "key_groups" && ctx2 == "") { bad(FNR, key ": <plaintext> (not inside a recipient list)"); return }
                    if (key == "enc" && val == "|") { inBody = 1; bodyCol = keycol; bodyInd = 0; bState = 0; encLine = FNR; return }
                    if (!okv(kind, val)) bad(FNR, key ": <plaintext>")
                  }
                  inSops && /^[^[:space:]#]/ { if (inBody) endbody(); inSops = 0 }
                  /^sops:[[:space:]]*$/ { inSops = 1; I1 = 0; ctx1 = ""; ctx2 = ""; inBody = 0; next }
                  inSops { sopsline(); next }
                  /^[[:space:]]*#/ { next }
                  /^[[:space:]]*$/ { next }
                  {
                    rest = $0
                    sub(/^[[:space:]]*(-[[:space:]]+)*/, "", rest)
                    if (rest == "-") next
                    if (rest ~ ENCRE) next
                    if (rest ~ /^[^:]+:[[:space:]]*$/) next
                    if (rest ~ /^[^:]+:[[:space:]]+ENC\[/) {
                      v = rest; sub(/^[^:]+:[[:space:]]+/, "", v)
                      if (v ~ ENCRE) next
                    }
                    # Print the key only: a CI log in a public repo must not repeat the plaintext.
                    if (rest ~ /:/) { key = rest; sub(/:.*$/, "", key); print "  line " FNR ": " key ": <plaintext>" }
                    else print "  line " FNR ": <plaintext line, no key>"
                  }
                  END { if (inSops && inBody) endbody() }
                ' "$f")
                ;;
            esac
            if [ -n "$plain" ]; then
              echo "::error file=$f::plaintext, or a line off the sops allowlist (values are never printed)"
              printf '%s\n' "$plain"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more secrets are not encrypted for the host. Re-encrypt with:"
            echo "  sops --encrypt --in-place <file>   (or sops -e <plaintext> > <file>)"
            echo "or, after fixing .sops.yaml:  sops updatekeys <file>"
            exit 1
          fi
          echo "all ${#files[@]} committed secret file(s) look like sops ciphertext for the host."
